<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#10A37F" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContentCard | Free Social Media Content Generator and Scheduler</title>
    <meta
      name="description"
      content="ContentCard is a free social media content generator and scheduler for teams that want on-brand posts, captions, and visuals fast."
    />
    <meta
      name="keywords"
      content="free social media content generator, free social media scheduler, ai social media content tool, content calendar automation"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.contentcard.co/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ContentCard" />
    <meta property="og:title" content="ContentCard | Free Social Media Content Generator and Scheduler" />
    <meta
      property="og:description"
      content="Generate campaign-ready social content with a free workflow built for social teams and business owners."
    />
    <meta property="og:url" content="https://www.contentcard.co/" />
    <meta property="og:image" content="https://www.contentcard.co/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ContentCard | Free Social Media Content Generator and Scheduler" />
    <meta
      name="twitter:description"
      content="Generate campaign-ready social content with a free workflow built for social teams and business owners."
    />
    <meta name="twitter:image" content="https://www.contentcard.co/og-image.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Bricolage+Grotesque:wght@600;700;800&family=Manrope:wght@500;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&display=swap" rel="stylesheet" />

    <!--
      Static JSON-LD served on every URL. Googlebot picks these up without
      running JS, which is what lets the SERP render an org snippet (logo +
      profiles) and the sitelinks search box on top of any per-page schema
      we inject from <Seo />.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ContentCard",
      "url": "https://www.contentcard.co",
      "logo": "https://www.contentcard.co/contentcard-logo-mark.svg",
      "description": "AI-powered social media content platform. Generate, schedule, and publish on-brand posts across Instagram, X, Facebook, and LinkedIn.",
      "sameAs": [
        "https://www.linkedin.com/company/contentcard",
        "https://x.com/contentcardhq",
        "https://www.instagram.com/contentcardhq",
        "https://www.facebook.com/contentcardhq"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "support@contentcard.co",
        "url": "https://www.contentcard.co/contact"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ContentCard",
      "alternateName": "ContentCard.co",
      "url": "https://www.contentcard.co"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
