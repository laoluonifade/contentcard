services:
  # ── Backend ──────────────────────────────────────────────────────
  - type: web
    name: contentcard-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: contentcard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_SMB
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BANNERBEAR_API_KEY
        sync: false
      - key: BANNERBEAR_TEMPLATE_COVER
        sync: false
      - key: BANNERBEAR_TEMPLATE_CONTENT
        sync: false
      - key: BANNERBEAR_TEMPLATE_QUOTE
        sync: false
      - key: BANNERBEAR_TEMPLATE_HOOK
        sync: false
      - key: BANNERBEAR_TEMPLATE_PROMO
        sync: false
      - key: BANNERBEAR_TEMPLATE_EDU
        sync: false
      - key: BANNERBEAR_TEMPLATE_TESTIMONIAL
        sync: false
      - key: BANNERBEAR_TEMPLATE_HIRING
        sync: false
      - key: FREE_TRIAL_DAYS
        value: "14"

  # ── Frontend ─────────────────────────────────────────────────────
  - type: web
    name: contentcard-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: contentcard-db
    databaseName: contentcard
    user: contentcard
    plan: starter
