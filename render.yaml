services:
  # ── Backend ──────────────────────────────────────────────────────
  - type: web
    name: contentcard-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Runs once on every deploy, against the same instance image as build,
    # before Render flips traffic to the new release. If the upgrade fails
    # the deploy halts and the old release keeps serving — the right
    # behaviour, since shipping new code that depends on a missing migration
    # is what got us into the contentstatus="FAILED" 500-loop.
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: contentcard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_SMB
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BANNERBEAR_API_KEY
        sync: false
      - key: BANNERBEAR_TEMPLATE_COVER
        sync: false
      - key: BANNERBEAR_TEMPLATE_CONTENT
        sync: false
      - key: BANNERBEAR_TEMPLATE_QUOTE
        sync: false
      - key: BANNERBEAR_TEMPLATE_HOOK
        sync: false
      - key: BANNERBEAR_TEMPLATE_PROMO
        sync: false
      - key: BANNERBEAR_TEMPLATE_EDU
        sync: false
      - key: BANNERBEAR_TEMPLATE_TESTIMONIAL
        sync: false
      - key: BANNERBEAR_TEMPLATE_HIRING
        sync: false
      - key: BANNERBEAR_TEMPLATE_TEXT_POSTER
        sync: false
      - key: BANNERBEAR_TEMPLATE_PRODUCT_HERO
        sync: false
      - key: BANNERBEAR_TEMPLATE_DATA_CARD
        sync: false
      - key: BANNERBEAR_TEMPLATE_ANNOUNCEMENT
        sync: false
      - key: BANNERBEAR_TEMPLATE_STORY_CAROUSEL
        sync: false
      - key: BANNERBEAR_TEMPLATE_ILLUSTRATION_EDITORIAL
        sync: false
      - key: QUALITY_GATE_ENABLED
        value: "true"
      - key: QUALITY_GATE_MIN_SCORE
        value: "0.66"
      - key: QUALITY_GATE_MAX_RETRIES
        value: "2"
      - key: MAX_REAL_PEOPLE_SHARE
        value: "0.35"
      - key: FREE_TRIAL_DAYS
        value: "14"

  # ── Frontend ─────────────────────────────────────────────────────
  # - type: web
  #   name: contentcard-web
  #   runtime: static
  #   rootDir: frontend
  #   buildCommand: npm install && npm run build
  #   staticPublishPath: dist
  #   routes:
  #     - type: rewrite
  #       source: /*
  #       destination: /index.html
  #   envVars:
  #     - key: VITE_API_URL
  #       sync: false

databases:
  - name: contentcard-db
    databaseName: contentcard
    user: contentcard
    plan: basic-256mb
